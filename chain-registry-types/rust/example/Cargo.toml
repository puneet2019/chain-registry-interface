[package]
name = "chain-registry-fetch-data-example"
version = "0.1.0"
edition = "2021"

[dependencies]
chain-registry-interface = "0.0.1-alpha1"
tokio = { version = "1.0", features = ["full"] }
# For a real implementation, you would use actual Cosmos Rust libraries
# This is a simplified example focusing on the registry integration
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
rand = "0.8"

[[bin]]
name = "fetch-chain-data"
path = "fetch-chain-data.rs"
