name: TypeScript CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (chain-registry-types/ts)
        working-directory: chain-registry-types/ts
        run: npm ci || npm i

      - name: Run TS tests (chain-registry-types/ts)
        working-directory: chain-registry-types/ts
        run: npm test
