name: Proto Release

on:
  push:
    tags:
      - "proto-*/v*"

permissions:
  contents: read

jobs:
  publish-ts:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          # Tag format: proto-<chain>/v<version>  e.g. proto-cosmoshub/v25.2.0-alpha.1
          TAG="${GITHUB_REF#refs/tags/}"
          CHAIN="${TAG#proto-}"
          CHAIN="${CHAIN%%/*}"
          VERSION="${TAG##*/}"
          echo "chain=$CHAIN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: proto/${{ steps.tag.outputs.chain }}/ts/${{ steps.tag.outputs.version }}
        run: npm publish --access public --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-rust:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CHAIN="${TAG#proto-}"
          CHAIN="${CHAIN%%/*}"
          VERSION="${TAG##*/}"
          echo "chain=$CHAIN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: proto/${{ steps.tag.outputs.chain }}/rust/${{ steps.tag.outputs.version }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
